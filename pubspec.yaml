name: job_application
description: Rozgar - Production-ready multi-role Job Portal Application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6
  firebase_messaging: ^15.2.5
  firebase_performance: ^0.10.1+5

  # State management & routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # Networking & data
  dio: ^5.8.0+1

  # Security & storage
  encrypt: ^5.0.3
  flutter_secure_storage: ^9.2.4

  # Media & uploads
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # Notifications & background
  flutter_local_notifications: ^19.0.0
  workmanager: ^0.5.2

  # Permissions & ads
  permission_handler: ^11.4.0
  google_mobile_ads: ^5.3.0

  # UI & animations
  shimmer: ^3.0.0

  # Utilities
  logger: ^2.5.0
  intl: ^0.20.2
  uuid: ^4.5.1
  equatable: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
